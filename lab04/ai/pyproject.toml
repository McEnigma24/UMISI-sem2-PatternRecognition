[project]
name = "lab04-seg"
version = "0.1.0"
description = "BDD100K traffic sign / light segmentation (PyTorch)"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "torch>=2.9.0",
    "torchvision>=0.24.0",
    "lightning>=2.5.0",
    "torchmetrics>=1.6.0",
    "transformers>=4.48.0",
    "timm>=1.0.0",
    "segmentation-models-pytorch>=0.4.0",
    "ultralytics>=8.3.0",
    "opencv-python-headless>=4.10.0",
    "albumentations>=2.0.0",
    "numpy>=2.2.0",
    "pandas>=2.2.0",
    "matplotlib>=3.8.0",
    "tensorboard>=2.19.0",
    "tqdm>=4.67.0",
    "pillow>=11.0.0",
    "scikit-learn>=1.5.0",
]

[dependency-groups]
jupyter = [
    "jupyterlab>=4.3.0",
    "ipykernel>=6.29.0",
    "ipython>=8.30.0",
]

[tool.uv]
default-groups = ["jupyter"]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu126" }
torchvision = { index = "pytorch-cu126" }