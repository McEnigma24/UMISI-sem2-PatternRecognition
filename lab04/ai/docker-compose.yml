# Dev-container: mount repo + BDD raw data (read-only)
#
#   docker compose --env-file _config_/config.env build
#   ./scripts/drun sync
#   ./shell.sh

name: ${PROJECT_NAME}

services:
  dev:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${PROJECT_NAME}:dev
    shm_size: "8gb"

    volumes:
      - .:/workspace
      - ../data:/workspace/data/raw:ro

    working_dir: /workspace
    stdin_open: true
    tty: true

    environment:
      HOST_UID: ${HOST_UID}
      HOST_GID: ${HOST_GID}
      HOST_USER: ${HOST_USER}
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      TZ: Europe/Warsaw
      PROJECT_NAME: ${PROJECT_NAME}
      PROJECT_DISPLAY_NAME: ${PROJECT_DISPLAY_NAME}
      PYTHONPATH_EXTRA: ${PYTHONPATH_EXTRA:-}
      UV_CACHE_DIR: /workspace/build/uv-cache
      UV_PYTHON_INSTALL_DIR: /workspace/build/python
      UV_PROJECT_ENVIRONMENT: /workspace/build/venv
      UV_PYTHON_DOWNLOADS: automatic
      JUPYTER_NOTEBOOK_DIR: ${JUPYTER_NOTEBOOK_DIR:-/workspace/notebooks}
      TENSORBOARD_LOGDIR: ${TENSORBOARD_LOGDIR:-/workspace/runs}
      HF_HOME: /workspace/saved_models/pretrained/downloaded/hf
      TORCH_HOME: /workspace/saved_models/pretrained/downloaded/torch
      YOLO_CONFIG_DIR: /workspace/saved_models/pretrained/downloaded/ultralytics
      JUPYTER_PORT: ${JUPYTER_PORT:-8889}
      TENSORBOARD_PORT: ${TENSORBOARD_PORT:-6007}

    ports:
      - "${JUPYTER_PORT:-8889}:8888"
      - "${TENSORBOARD_PORT:-6007}:6006"

    entrypoint: ["/workspace/docker/entrypoint.sh"]
    command: ["bash"]